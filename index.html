<title>漯河西站站台大屏</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Microsoft YaHei",sans-serif;
}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:#000;
}

.station-header{
  width:100%;
  height:18vh;
  background:#0f243a;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  flex-shrink:0;
  margin-bottom:12px;
}
.station-cn{
  font-size:9vh;
  font-weight:bold;
  letter-spacing:0.6vw;
}
.station-en{
  font-size:3vh;
  margin-top:1vh;
  opacity:0.9;
}

.main-container{
  flex:1;
  display:flex;
  gap:16px;
  padding:0 12px;
  overflow:hidden;
}
.col-left,.col-right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.platform-group{
  display:flex;
  gap:12px;
  align-items:center;
  height:24vh;
}

.platform-even{
  flex:1;
  height:100%;
  background:#111;
  color:#ffdd00;
  display:grid;
  grid-template-columns:60px 1fr;
}

.platform-odd{
  flex:1;
  height:100%;
  background:#111;
  color:#ffdd00;
  display:grid;
  grid-template-columns:1fr 60px;
}

.platform-num{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:8vh;
  font-weight:bold;
  color:#fff;
  background:#0a1828;
}

.platform-content{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:8px;
  gap:12px;
  height:100%;
}
.train-top{
  font-size:4vh;
  display:flex;
  width:100%;
  justify-content:space-between;
  padding:0 10px;
}
.train-line{
  font-size:3.8vh;
}

.empty-text{
  color:#ffdd00;
  text-align:center;
  display:flex;
  flex-direction:column;
  gap:16px;
  height:100%;
  justify-content:center;
  font-size:3.6vh;
  font-weight:bold;
  line-height:1.4;
}

.clock-wrap{
  width:14vh;
  height:14vh;
  border-radius:50%;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  flex-shrink:0;
}
.clock-face{
  width:92%;
  height:92%;
  border-radius:50%;
  position:relative;
  background:#fff;
}
.clock-num{
  position:absolute;
  font-size:2vh;
  color:#000;
  font-weight:bold;
}
.clock-num12{top:4px;left:50%;transform:translateX(-50%);}
.clock-num3{right:4px;top:50%;transform:translateY(-50%);}
.clock-num6{bottom:4px;left:50%;transform:translateX(-50%);}
.clock-num9{left:4px;top:50%;transform:translateY(-50%);}

.h-hand,.m-hand{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:bottom center;
  background:#000;
  border-radius:4px;
}
.h-hand{
  width:8px;
  height:35%;
  margin-left:-4px;
  z-index:3;
}
.m-hand{
  width:6px;
  height:45%;
  margin-left:-3px;
  z-index:4;
}

.edit-btn{
  position:fixed;
  top:10px;
  right:10px;
  z-index:99;
  padding:6px 12px;
  background:#2382d2;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:14px;
  cursor:pointer;
}

.edit-panel{
  position:fixed;
  top:50px;
  right:10px;
  width:400px;
  background:#0a1828;
  border:1px solid #4488dd;
  padding:16px;
  color:#fff;
  display:none;
  z-index:99;
  max-height:85vh;
  overflow-y:auto;
}
.edit-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}
.block-line{
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:1px solid #446;
}
.input-item{
  width:100%;
  padding:8px;
  font-size:16px;
  margin-bottom:8px;
  color:#000;
}
.btn-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:4px;
  font-size:15px;
  cursor:pointer;
}
.btn-add{background:#23a24d;color:#fff;}
.btn-save{background:#217ad9;color:#fff;}
.rule-desc{
  font-size:13px;
  color:#ccc;
  margin-top:12px;
  line-height:1.5;
}
.item{
  margin-bottom:10px;
}
.item label{
  display:block;
  margin-bottom:4px;
  font-size:14px;
}
.debug-box{

  padding:10px;
  background:#111;

  color:#ffdd00;

</style>
</head>

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function pad2(n){
  return n < 10 ? "0" + n : n;
}

function getDayTs(h, m){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).getTime();
}

function getMinDiff(targetH, targetM){
  const now = new Date();
  const target = getDayTs(targetH, targetM);
  const diffMs = target - now.getTime();
  return Math.floor(diffMs / 60000);
}

function updateStationName(){
  $("#cnStation").innerText = stationCn;
  $("#enStation").innerText = stationEn;
}

function updateDebug(){
  const box = $("#debugBox");
  if(!box) return;

  const now = new Date();
  const lines = [];
  lines.push("当前时间：" + now.toLocaleTimeString("zh-CN"));

  for(const plat of Object.keys(platformTrains)){
    const trains = platformTrains[plat];
    lines.push("站台" + plat + "：" + trains.length + "趟");
    trains.slice(0, 3).forEach(t=>{
      lines.push("  " + t.no + " " + t.from + "→" + t.to + " " + t.depTime);
    });
    if(trains.length > 3){
      lines.push("  ...共" + trains.length + "趟");
    }
  }

  box.innerText = lines.join("\n");
}

function renderSingleTrain(box, train, isEven){
  if(isEven){
    box.innerHTML = `
      <div class="train-top">
        <span>${train.depTime}开</span>
        <span>${train.no}</span>
      </div>
      <div class="train-line">${train.to} ← ${train.from}</div>
    `;
  }else{
    box.innerHTML = `
      <div class="train-top">
        <span>${train.no}</span>
        <span>${train.depTime}开</span>
      </div>
      <div class="train-line">${train.from} → ${train.to}</div>
    `;
  }
}

function renderPlatform(platEl, platNum){
  const contentBox = platEl.querySelector(".platform-content");
  const trains = platformTrains[platNum] || [];
  const now = new Date();
  const stationName = stationCn;

  let allValidTrains = [];

  for(const t of trains){
    const [depH, depM] = t.depTime.split(":").map(Number);
    const diffMin = getMinDiff(depH, depM);
    const isStart = t.from === "漯河西";
    const isArrive = t.to === "漯河西";
    const depTs = getDayTs(depH, depM);
    const departDiff = now.getTime() - depTs;

    let canShow = false;

    if(isStart){
      if(diffMin >= 0 && diffMin <= DEPART_LOCAL_MIN){
        canShow = true;
      }
    }else if(!isArrive){
      if(diffMin >= 0 && diffMin <= PASS_LOCAL_MIN){
        canShow = true;
      }
    }

    if(isArrive && departDiff >= 0 && departDiff <= ARRIVE_CLEAR_MIN * 60000){
      canShow = true;
    }

    if(!isArrive && departDiff > CLEAR_AFTER_DEPART_MIN * 60000){
      continue;
    }

    if(canShow){
      allValidTrains.push({...t, depTs, isArrive});
    }
  }

  allValidTrains.sort((a, b) => a.depTs - b.depTs);

  if(allValidTrains.length === 0){
    contentBox.innerHTML = `
      <div class="empty-text">
        <div>不忘初心，牢记使命。</div>
        <div>交通强国，铁路先行。</div>
      </div>
    `;
    return;
  }

  const firstTrain = allValidTrains[0];
  const hasNext = allValidTrains.length > 1;
  const gapNow = now.getTime() - firstTrain.depTs;

  if(hasNext){
    if((!firstTrain.isArrive && gapNow > 0) || (firstTrain.isArrive && gapNow > 60000)){
      renderSingleTrain(contentBox, allValidTrains[1], platEl.classList.contains("platform-even"));
      return;
    }
  }

  renderSingleTrain(contentBox, firstTrain, platEl.classList.contains("platform-even"));
}

function refreshAllPlatform(){
  $$(".platform-even, .platform-odd").forEach(el=>{
    const p = el.dataset.station;
    renderPlatform(el, p);
  });
  updateDebug();
}

function updateAllClocks(){
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();

  const hDeg = h * 30 + m * 0.5;
  const mDeg = m * 6;

  $$(".h-hand").forEach(el=>{
    el.style.transform = "translateX(-50%) rotate(" + hDeg + "deg)";
  });

  $$(".m-hand").forEach(el=>{
    el.style.transform = "translateX(-50%) rotate(" + mDeg + "deg)";
  });
}

function toggleEditPanel(){
  const panel = $("#editPanel");
  const btn = $("#toggleEdit");

  if(panel.style.display === "block"){
    panel.style.display = "none";
    btn.innerText = "打开后台编辑";
  }else{
    panel.style.display = "block";
    btn.innerText = "关闭后台编辑";
    $("#editCnStation").value = stationCn;
    $("#editEnStation").value = stationEn;
    updateDebug();
  }
}

function addTrain(){
  const plat = $("#editPlat").value.trim();
  const no = $("#editTrainNo").value.trim();
  const from = $("#editFrom").value.trim();
  const to = $("#editTo").value.trim();
  const dep = $("#editDep").value.trim();

  if(!plat || !no || !from || !to || !dep){
    alert("请完整填写所有车次信息");
    return;
  }

  if(!/^\d+$/.test(plat) || plat < 1 || plat > 12){
    alert("站台号必须是1-12数字");
    return;
  }

  if(!/^\d{1,2}:\d{2}$/.test(dep)){
    alert("开车时间格式 HH:mm");
    return;
  }

  if(!platformTrains[plat]){
    platformTrains[plat] = [];
  }

  platformTrains[plat].push({
    no,
    from,
    to,
    depTime: dep
  });

  $("#editTrainNo").value = "";
  $("#editFrom").value = "";
  $("#editTo").value = "";
  $("#editDep").value = "";

  refreshAllPlatform();
  alert("已添加车次到站台" + plat);
}

function clearPlatform(){
  const plat = $("#editPlat").value.trim();
  if(!plat) return;

  platformTrains[plat] = [];
  refreshAllPlatform();
  alert("已清空站台" + plat);
}

function saveStationName(){
  stationCn = $("#editCnStation").value.trim();
  stationEn = $("#editEnStation").value.trim();
  updateStationName();
}

function bindEvents(){
  $("#toggleEdit").addEventListener("click", toggleEditPanel);
  $("#btnAddTrain").addEventListener("click", addTrain);
  $("#btnClearPlat").addEventListener("click", clearPlatform);
  $("#editCnStation").addEventListener("change", saveStationName);
  $("#editEnStation").addEventListener("change", saveStationName);
}

function init(){
  updateStationName();
  bindEvents();
  updateAllClocks();
  refreshAllPlatform();

  setInterval(updateAllClocks, 1000);
  setInterval(refreshAllPlatform, 1000);
}

window.onload = init;
